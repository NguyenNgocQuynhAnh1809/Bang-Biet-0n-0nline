<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BẢNG BIẾT ƠN - Tổng hợp</title>
    <link rel="icon" type="image/png" href="assets/images/heart.png" />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg">
    <header class="topbar">
      <a class="icon-btn" href="index.html" aria-label="Quay lại">←</a>
      <h1 class="title">BẢNG BIẾT ƠN</h1>
      <a
        class="icon-btn"
        href="https://www.facebook.com/profile.php?id=61573943127515"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Facebook cá nhân"
        >💛</a
      >
    </header>

    <main class="container">
      <section class="stats">
        <h2 class="sr-only">Thống kê cảm xúc</h2>
        <div id="legend" class="legend"></div>
        <div id="bar" class="bar"></div>
        <div id="total" class="total"></div>
      </section>

      <section
        class="grid"
        id="grid"
        aria-live="polite"
        aria-busy="true"
      ></section>
    </main>

    <!-- ===== BẮT ĐẦU KHỐI MÃ MODAL BÌNH LUẬN (THÊM VÀO ĐÂY) ===== -->
    <div
      id="comment-modal"
      class="modal-overlay"
      style="display: none"
      aria-hidden="true"
    >
      <div
        class="comment-modal-content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <span class="close-comment-modal" aria-label="Đóng">&times;</span>

        <div class="comment-modal-body">
          <div class="comment-modal-left">
            <div
              id="modal-card-detail"
              class="gratitude-item-modal"
              data-emoji="❤️"
            >
              <div class="content">
                <p style="margin: 0 0 8px 0; color: inherit">
                  Nội dung đang tải...
                </p>
              </div>
              <div class="footer">
                <div class="tag">Great</div>
                <div class="time">• —</div>
              </div>
            </div>
            <!-- Khu vực nhập bình luận -->
            <div class="comment-input-area">
              <div class="comment-input-wrapper">
                <input
                  type="text"
                  id="comment-input"
                  placeholder="Viết bình luận..."
                />
                <!-- Khu vực biểu tượng cảm xúc bên trong khung -->
                <div class="reaction-icons">
                  <button class="react-btn" data-reaction="1">
                    <img src="assets/images/1.png" alt="Thích" />
                  </button>
                  <button class="react-btn" data-reaction="2">
                    <img src="assets/images/2.png" alt="Yêu thích" />
                  </button>
                  <button class="react-btn" data-reaction="3">
                    <img src="assets/images/3.png" alt="Haha" />
                  </button>
                  <button class="react-btn" data-reaction="4">
                    <img src="assets/images/4.png" alt="Wow" />
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="comment-modal-right">
            <div id="comment-list">
              <!-- Các bình luận sẽ được chèn vào đây bởi JS -->
            </div>
            <!-- THAY ĐỔI: Thêm khu vực hiển thị reactions và tổng bình luận -->
            <div class="comment-summary">
              <div id="reaction-summary" class="reaction-summary">
                <!-- Reaction counts sẽ được chèn vào đây -->
              </div>
              <span id="comment-count">0 bình luận</span>
            </div>
          </div>
        </div>
      </div>
    </div>
