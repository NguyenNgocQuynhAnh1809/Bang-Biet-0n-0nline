<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BẢNG BIẾT ƠN - Tổng hợp</title>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="bg">
    <header class="topbar">
      <a class="icon-btn" href="./index.html" aria-label="Quay lại">←</a>
      <h1 class="title">BẢNG BIẾT ƠN</h1>
      <a
        class="icon-btn"
        href="https://www.facebook.com/profile.php?id=61573943127515"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Facebook cá nhân"
        >💛</a
      >
    </header>

    <main class="container">
      <section class="stats">
        <h2 class="sr-only">Thống kê cảm xúc</h2>
        <div id="legend" class="legend"></div>
        <div id="bar" class="bar"></div>
        <div id="total" class="total"></div>
      </section>

      <section
        class="grid"
        id="grid"
        aria-live="polite"
        aria-busy="true"
      ></section>
    </main>

    <!-- Modal chi tiết -->
    <div id="noteModal" class="modal" aria-hidden="true">
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <div class="modal-body">
          <!-- Nội dung thẻ chính bên trái -->
          <div class="modal-main-card">
            <div id="modalCardContent" class="modal-card-inner"></div>
          </div>

          <!-- Phần emoji reactions -->
          <div class="modal-reactions">
            <div class="emoji-input-label">Viết bình luận...</div>
            <div id="emojiButtons" class="emoji-row"></div>
          </div>

          <!-- Phần bình luận bên phải -->
          <div class="modal-comments-wrapper">
            <div id="commentsList" class="comments-list-display"></div>
            <div id="commentsCount" class="comments-count-badge">0 bình luận</div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./board.js"></script>
  </body>
</html>
