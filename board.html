<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BẢNG BIẾT ƠN - Tổng hợp</title>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="bg">
    <header class="topbar">
      <a class="icon-btn" href="./index.html" aria-label="Quay lại">←</a>
      <h1 class="title">BẢNG BIẾT ƠN</h1>
      <a
        class="icon-btn"
        href="https://www.facebook.com/profile.php?id=61573943127515"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Facebook cá nhân"
        >💛</a
      >
    </header>

    <main class="container">
      <section class="stats">
        <h2 class="sr-only">Thống kê cảm xúc</h2>
        <div id="legend" class="legend"></div>
        <div id="bar" class="bar"></div>
        <div id="total" class="total"></div>
      </section>

      <section
        class="grid"
        id="grid"
        aria-live="polite"
        aria-busy="true"
      ></section>
    </main>

    <!-- Modal chi tiết thẻ - Giống Facebook -->
    <div id="noteModal" class="modal" aria-hidden="true">
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">Chi tiết</h2>
          <button class="close-modal" aria-label="Đóng">×</button>
        </div>
        <div class="modal-body">
          <div id="modalText" class="modal-main-text"></div>
          <div id="modalMeta" class="modal-meta"></div>
          
          <!-- Emoji reactions - Giống Facebook -->
          <div class="emoji-reactions">
            <div class="emoji-title">Cảm xúc của bạn</div>
            <div class="emoji-buttons" id="emojiButtons">
              <!-- Sẽ được render từ JavaScript với ảnh -->
            </div>
          </div>

          <!-- Comments section -->
          <div class="comments-section">
            <h3>Bình luận</h3>
            <div id="commentsList" class="comments-list"></div>
            <div class="comment-input-wrapper">
              <textarea 
                id="commentInput" 
                class="comment-input" 
                placeholder="Ai cười vậy"
                maxlength="500"
              ></textarea>
              <button id="submitComment" class="submit-comment-btn">Gửi</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./board.js"></script>
  </body>
</html>
