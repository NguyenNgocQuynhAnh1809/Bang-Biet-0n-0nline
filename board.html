<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BẢNG BIẾT ƠN - Tổng hợp</title>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
    <!-- SỬA Ở ĐÂY: Bỏ "./" -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg">
    <header class="topbar">
      <!-- SỬA Ở ĐÂY: Bỏ "./" ở đường dẫn quay lại trang chủ -->
      <a class="icon-btn" href="index.html" aria-label="Quay lại">←</a>
      <h1 class="title">BẢNG BIẾT ƠN</h1>
      <a
        class="icon-btn"
        href="https://www.facebook.com/profile.php?id=61573943127515"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Facebook cá nhân"
        >💛</a
      >
    </header>

    <main class="container">
      <section class="stats">
        <h2 class="sr-only">Thống kê cảm xúc</h2>
        <div id="legend" class="legend"></div>
        <div id="bar" class="bar"></div>
        <div id="total" class="total"></div>
      </section>

      <section
        class="grid"
        id="grid"
        aria-live="polite"
        aria-busy="true"
      ></section>
    </main>
    
    <!-- ===== BẮT ĐẦU KHỐI MÃ MODAL BÌNH LUẬN (THÊM VÀO ĐÂY) ===== -->
    <div id="comment-modal" class="modal-overlay" style="display: none;">
        <div class="comment-modal-content">
            <span class="close-comment-modal">&times;</span>
            <img src="https://em-content.zobj.net/source/samsung/380/pushpin_1f4cc.png" alt="pin" class="pin-img">
            <div class="comment-modal-body">
                <div class="comment-modal-left">
                    <div id="modal-card-detail" class="gratitude-item-modal">
                        <!-- Chi tiết thẻ sẽ được JS điền vào đây -->
                    </div>
                    <div class="comment-input-area">
                        <div class="comment-input-wrapper">
                            <input type="text" id="comment-input" placeholder="Viết bình luận...">
                            <div class="reaction-icons">
                                <span class="react-icon">❤️</span>
                                <span class="react-icon">👍</span>
                                <span class="react-icon">😂</span>
                                <span class="react-icon">😍</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="comment-modal-right">
                    <div id="comment-list">
                        <!-- Danh sách bình luận sẽ được JS điền vào đây -->
                    </div>
                    <div class="comment-footer">
                        <span id="comment-count">0 bình luận</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- ===== KẾT THÚC KHỐI MÃ MODAL BÌNH LUẬN ===== -->

    <!-- SỬA Ở ĐÂY: Bỏ "./" -->
    <script type="module" src="board.js"></script>
  </body>
</html>
